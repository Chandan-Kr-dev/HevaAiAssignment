services:
  postgres:
    image: postgres:16
    container_name: heva-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: heva
      POSTGRES_PASSWORD: heva
      POSTGRES_DB: heva
    volumes:
      - heva-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: heva-redis
    ports:
      - "6379:6379"

volumes:
  heva-pgdata:
