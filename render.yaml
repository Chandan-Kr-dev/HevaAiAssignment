# Render blueprint: Postgres + Redis + API in one click.
# Dashboard: Blueprints -> New Blueprint Instance -> select this repo.
# Secrets marked `sync: false` must be filled in the dashboard (never committed).
# NOTE: do NOT set PORT here — Render injects its own $PORT automatically.
services:
  - type: web
    name: heva-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate && npm run build
    # migrate on every boot (idempotent): covers databases recreated after the app.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /products
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heva-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: heva-redis
          property: connectionString
      - key: WEB_URL
        sync: false # e.g. https://heva-web.vercel.app (your Vercel URL, no trailing slash)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # https://<your-vercel-app>.vercel.app/api/auth/google/callback (must also be registered in Google console)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_API_BASE_URL
        value: https://api.mailgun.net
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true

  - type: redis
    name: heva-redis
    plan: free
    ipAllowList: [] # internal access only

databases:
  - name: heva-db
    plan: free
    databaseName: heva
    user: heva
