# Render blueprint: API service only. Databases are EXTERNAL free tiers
# (Render no longer offers free Postgres/Redis):
#   - Postgres: Neon (https://neon.tech) free tier
#   - Redis:    Upstash (https://upstash.com) free tier
# Dashboard: Blueprints -> New Blueprint Instance -> select this repo, then
# fill every `sync: false` variable below.
# NOTE: do NOT set PORT here — Render injects its own $PORT automatically.
services:
  - type: web
    name: heva-api
    runtime: node
    plan: free
    rootDir: apps/api
    # --include=dev: Render sets NODE_ENV=production, which makes npm ci skip
    # devDependencies — but @nestjs/cli, typescript and prisma are needed to build.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # migrate on every boot (idempotent): covers databases recreated after the app.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /products
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon DIRECT connection string (NOT the -pooler one: Prisma interactive transactions need a direct connection). Looks like: postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/heva?sslmode=require
      - key: REDIS_URL
        sync: false # Upstash Redis endpoint, e.g. rediss://default:xxx@xxx.upstash.io:6379 (rediss:// with double-s, TLS on)
      - key: WEB_URL
        sync: false # e.g. https://heva-web.vercel.app (your Vercel URL, no trailing slash)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # https://<your-vercel-app>.vercel.app/api/auth/google/callback (must also be registered in Google console)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_API_BASE_URL
        value: https://api.mailgun.net
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
